[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-insight-agent"
version = "0.1.0"
description = "A LangGraph-based retail analytics and policy knowledge assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "肖杰" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4.0",
  "langchain-core>=1.0,<2.0",
  "langsmith>=0.4,<1.0",
  "sqlglot>=26,<31",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiomysql>=0.2,<1.0",
  "cryptography>=43,<50",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
prototype = [
  "streamlit>=1.40,<2.0",
  "plotly>=5.24,<7.0",
  "requests>=2.32,<3.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]
rag = [
  "chromadb>=1.0,<2.0",
  "sentence-transformers>=5.0,<6.0",
  "pypdf>=6.0,<7.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.2,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "chromadb",
  "chromadb.*",
  "numpy",
  "numpy.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "torch",
  "torch.*",
  "docx",
  "docx.*",
  "pypdf",
  "pypdf.*",
  "fitz",
  "fitz.*",
]
follow_imports = "skip"
ignore_missing_imports = true
