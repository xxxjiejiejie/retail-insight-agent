[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-insight-agent"
version = "0.1.0"
description = "A LangGraph-based retail analytics and policy knowledge assistant."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "肖杰" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "langgraph>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "sqlglot>=26,<31",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiomysql>=0.2,<1.0",
  "cryptography>=43,<50",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
prototype = [
  "streamlit>=1.40,<2.0",
  "plotly>=5.24,<7.0",
  "requests>=2.32,<3.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
