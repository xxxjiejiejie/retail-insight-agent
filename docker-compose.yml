services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retail_insight
      MYSQL_USER: retail
      MYSQL_PASSWORD: retail
      MYSQL_ROOT_PASSWORD: local-dev-only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/seed/demo_data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
      - ./data/seed/readonly_user.sql:/docker-entrypoint-initdb.d/03-readonly-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-dev-only"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://retail_readonly:readonly-local-dev@mysql:3306/retail_insight
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
