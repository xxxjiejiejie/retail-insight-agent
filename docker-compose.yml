services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retail_insight
      MYSQL_USER: retail
      MYSQL_PASSWORD: retail
      MYSQL_ROOT_PASSWORD: local-dev-only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-dev-only"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://retail:retail@mysql:3306/retail_insight
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:

